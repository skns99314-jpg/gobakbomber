<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siber Panel - Döngüsel Tetikleyici</title>
    <style>
        :root {
            --neon-green: #00ff66;
            --cyber-blue: #00e5ff;
            --dark-bg: #050a0e;
            --panel-bg: rgba(10, 16, 22, 0.75);
            --border-color: rgba(0, 255, 110, 0.25);
            --error-red: #ff5f56;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.15;
        }

        .glass-panel {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 35px 30px;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 255, 102, 0.15);
            text-align: center;
        }

        .panel-header {
            margin-bottom: 25px;
        }

        .panel-header h2 {
            font-size: 1.8rem;
            color: var(--neon-green);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--cyber-blue);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .phone-input {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .btn-container {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .start-btn {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
        }

        .start-btn:hover:not(:disabled) {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 20px var(--neon-green);
        }

        .stop-btn {
            background: transparent;
            border: 1px solid var(--error-red);
            color: var(--error-red);
        }

        .stop-btn:hover:not(:disabled) {
            background: var(--error-red);
            color: #000;
            box-shadow: 0 0 20px var(--error-red);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .status-console {
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.8rem;
            height: 150px;
            overflow-y: auto;
            text-align: left;
            color: #a5c3db;
        }

        .log-line { margin-bottom: 4px; }
        .log-success { color: var(--neon-green); }
        .log-info { color: var(--cyber-blue); }
        .log-error { color: var(--error-red); }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="glass-panel">
        <div class="panel-header">
            <h2>Sürekli Tetikleyici</h2>
        </div>

        <form onsubmit="baslatDöngü(event)">
            <div class="input-group">
                <label for="phone">Hedef Numara</label>
                <input type="tel" id="phone" class="phone-input" placeholder="5xx xxxxxxx" maxlength="10" required>
            </div>

            <div class="btn-container">
                <button type="submit" class="btn start-btn" id="startBtn">Başlat</button>
                <button type="button" class="btn stop-btn" id="stopBtn" onclick="durdurDöngü()" disabled>Durdur</button>
            </div>
        </form>

        <div class="status-console" id="consoleLog">
            <div class="log-line log-info">[SİSTEM] Hazır.</div>
        </div>
    </div>

    <script>
        // Matrix Efekti
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const chars = '0123456789ABCDEF'.split('');
        const fontSize = 12;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = 'rgba(5, 10, 14, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff66'; ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 33);

        // Döngü Yönetimi
        let donguInterval = null;
        let sayac = 0;

        function baslatDöngü(event) {
            event.preventDefault();
            const numara = document.getElementById('phone').value;
            
            if(numara.length !== 10) {
                addLog("[HATA] Numara 10 haneli olmalıdır.", "log-error");
                return;
            }

            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            sayac = 0;

            addLog(`[BAŞLADI] +90${numara} için döngüsel istekler başlatılıyor...`, "log-info");

            // Ardarda çok hızlı istek simülasyonu (Her 300 milisaniyede bir tetikler)
            donguInterval = setInterval(() => {
                sayac++;
                addLog(`[İSTEK #${sayac}] spammers/utils modülüne sinyal gönderildi.`, "log-success");
                
                // Eğer gerçek bir API ucuna istek atmak istersen burayı kullanabilirsin:
                // fetch('API_URL_BURAYA', { method: 'POST', body: JSON.stringify({phone: numara}) });
                
            }, 300); 
        }

        function durdurDöngü() {
            if(donguInterval) {
                clearInterval(donguInterval);
                donguInterval = null;
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                addLog(`[DURDURULDU] İşlem kullanıcı tarafından kesildi. Toplam istek: ${sayac}`, "log-error");
            }
        }

        function addLog(text, className) {
            const consoleLog = document.getElementById('consoleLog');
            const newLine = document.createElement('div');
            newLine.className = `log-line ${className}`;
            newLine.innerText = text;
            consoleLog.appendChild(newLine);
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }
    </script>
</body>
</html>
