<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siber Panel - Kontrol Merkezi</title>
    <style>
        :root {
            --neon-green: #00ff66;
            --cyber-blue: #00e5ff;
            --dark-bg: #050a0e;
            --panel-bg: rgba(10, 16, 22, 0.75);
            --border-color: rgba(0, 255, 110, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Matrix Arka Plan Alanı */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.15;
        }

        /* Merkezi Kontrol Paneli */
        .glass-panel {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 35px 30px;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 255, 102, 0.15);
            text-align: center;
        }

        .panel-header {
            margin-bottom: 25px;
        }

        .panel-header h2 {
            font-size: 1.8rem;
            color: var(--neon-green);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
            font-weight: 700;
        }

        .panel-header p {
            font-size: 0.85rem;
            color: #8da2b5;
            margin-top: 5px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--cyber-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .prefix {
            position: absolute;
            left: 15px;
            color: #557085;
            font-size: 0.95rem;
            user-select: none;
        }

        .phone-input {
            width: 100%;
            padding: 14px 15px 14px 50px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            letter-spacing: 1px;
            outline: none;
            transition: all 0.3s ease;
        }

        .phone-input:focus {
            border-color: var(--cyber-blue);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        .start-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(0, 255, 102, 0.1), rgba(0, 229, 255, 0.1));
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.4s ease;
            margin-top: 10px;
        }

        .start-btn:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 20px var(--neon-green);
        }

        /* Durum Log Konsolu */
        .status-console {
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.8rem;
            height: 110px;
            overflow-y: auto;
            text-align: left;
            color: #a5c3db;
        }

        .log-line {
            margin-bottom: 4px;
        }
        .log-success { color: var(--neon-green); }
        .log-info { color: var(--cyber-blue); }
        .log-error { color: #ff5f56; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="glass-panel">
        <div class="panel-header">
            <h2>SMS Gönderim Paneli</h2>
            <p>Netlify Uyumlu Statik Kontrol Merkezi</p>
        </div>

        <form id="controlForm" onsubmit="islemBaslat(event)">
            <div class="input-group">
                <label for="phone">Hedef Telefon Numarası</label>
                <div class="input-field-wrapper">
                    <span class="prefix">+90</span>
                    <input type="tel" id="phone" name="phone" class="phone-input" placeholder="5xx xxx xx xx" maxlength="10" required autocomplete="off">
                </div>
            </div>

            <button type="submit" class="start-btn" id="submitBtn">Sistemi Başlat</button>
        </form>

        <div class="status-console" id="consoleLog">
            <div class="log-line log-info">[SİSTEM] Modül hazır. Netlify üzerinde aktif.</div>
            <div class="log-line">[SİSTEM] Numara girişi bekleniyor...</div>
        </div>
    </div>

    <script>
        // Arka plan akan kod efekti (Matrix)
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        const fontSize = 12;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = 'rgba(5, 10, 14, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 33);

        // PHP mantığını HTML/JS içinde simüle eden fonksiyon
        function islemBaslat(event) {
            event.preventDefault();
            
            const phoneInput = document.getElementById('phone').value.trim();
            const consoleLog = document.getElementById('consoleLog');
            const btn = document.getElementById('submitBtn');
            
            // Sadece sayıları filtrele
            const cleanPhone = phoneInput.replace(/[^0-9]/g, '');

            if (cleanPhone.length !== 10) {
                addLog('[HATA] Geçersiz numara biçimi. Başında sıfır olmadan 10 hane girin.', 'log-error');
                return;
            }

            btn.disabled = true;
            btn.innerText = "İŞLENİYOR...";

            addLog(`[BİLGİ] +90 ${cleanPhone} için istek paketi hazırlanıyor...`, 'log-info');

            // 1 saniye simülasyon gecikmesi sonrası başarı logu ekleme (utils.php yerine tetikleme görünümü)
            setTimeout(() => {
                addLog(`[BAŞARILI] Hedef tanımlandı: +90 ${cleanPhone}`, 'log-success');
                addLog(`[SİSTEM] spammers/utils.php simülasyonu çalıştırıldı.`, 'log-success');
                
                btn.disabled = false;
                btn.innerText = "SİSTEMİ BAŞLAT";
            }, 1200);
        }

        function addLog(text, className) {
            const consoleLog = document.getElementById('consoleLog');
            const newLine = document.createElement('div');
            newLine.className = `log-line ${className}`;
            newLine.innerText = text;
            consoleLog.appendChild(newLine);
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }
    </script>
</body>
</html>
